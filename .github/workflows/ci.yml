name: Continuous Integration

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL_TEST: "http://127.0.0.1:54321"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Start Supabase (Local)
        run: npx supabase start -x studio,migra,imgproxy,logflare,vector

      - name: Wait for containers
        run: sleep 15

      - name: Create .env.test
        run: |
          cat > .env.test <<EOF
          NEXT_PUBLIC_SUPABASE_URL_TEST=http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SERVICE_ROLE_KEY_TEST }}
          EOF

      - name: Run Unit Tests
        run: |
          set -a
          source .env.test || true
          set +a
          npm test
