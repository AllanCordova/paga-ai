name: Continuous Integration

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          touch .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SERVICE_ROLE_KEY_TEST }}" >> .env.test
          cat .env.test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Start Supabase (Local)
        run: npx supabase start -x studio,migra,imgproxy,logflare,vector

      - name: Wait for containers
        run: sleep 15

      - name: Run Unit Tests
        run: npm run test
